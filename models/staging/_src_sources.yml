version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 4, period: day}
    tables:
      - name: customers
        identifier: jaffle_shop_customers
        description: "This is the customers table from the jaffle_shop database."
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null 
      - name: orders
        identifier: jaffle_shop_orders
        description: "This is the orders table from the jaffle_shop database."
  - name: stripe
    database: raw
    schema: stripe
    config:
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 4, period: day}
    tables:
      - name: payments
        identifier: payments
        description: "This is the payments table from the stripe database."
    
