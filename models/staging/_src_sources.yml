version: 2

sources:
  - name: jaffle_shop
    description: "This is the source for the jaffle_shop database stored in databricks."
    database: raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 4, period: day}
    tables:
      - name: customers
        identifier: jaffle_shop_customers
        description: "Raw customers table from the jaffle_shop database stored in databricks."
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: orders
        identifier: jaffle_shop_orders
        description: "Raw orders table from the jaffle_shop database stored in databricks."
  - name: stripe
    database: raw
    schema: stripe
    description: "This is the source for the stripe database stored in databricks."
    config:
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 4, period: day}
    tables:
      - name: payments
        identifier: payments
        description: "Raw payments table from the stripe database."
